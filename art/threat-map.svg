<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Memory Firewall candidate-set resolver</title><desc id="desc">The full recalled candidate set is resolved for lifecycle and scope before a final disposition is returned.</desc>
<rect width="1200" height="360" fill="#11111B"/><text x="44" y="52" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="28" font-weight="700">Memory Firewall</text><text x="44" y="80" fill="#A1A1AA" font-family="Arial,sans-serif" font-size="16">CANDIDATE-SET CONTROL PLANE — resolve the whole recalled set before any action</text>
<g font-family="Arial,sans-serif"><rect x="45" y="135" width="208" height="78" rx="12" fill="#3B1826" stroke="#FB7185"/><text x="149" y="169" fill="#FECDD3" font-size="16" font-weight="700" text-anchor="middle">TOP-K CANDIDATE SET</text><text x="149" y="192" fill="#FDA4AF" font-size="13" text-anchor="middle">mixed / partial / hostile</text>
<path d="M253 174H308" stroke="#71717A" stroke-width="3"/><path d="M301 168L313 174 301 180" fill="none" stroke="#71717A" stroke-width="3"/>
<rect x="315" y="112" width="255" height="124" rx="12" fill="#29253A" stroke="#A78BFA"/><text x="442" y="148" fill="#EDE9FE" font-size="16" font-weight="700" text-anchor="middle">SET RESOLUTION</text><text x="442" y="174" fill="#DDD6FE" font-size="13" text-anchor="middle">per-record dispositions</text><text x="442" y="195" fill="#DDD6FE" font-size="13" text-anchor="middle">supersession · expiry · revoke</text><text x="442" y="216" fill="#DDD6FE" font-size="13" text-anchor="middle">conflict before scope</text>
<path d="M570 174H626" stroke="#71717A" stroke-width="3"/><path d="M619 168L631 174 619 180" fill="none" stroke="#71717A" stroke-width="3"/>
<rect x="633" y="135" width="210" height="78" rx="12" fill="#202B3C" stroke="#60A5FA"/><text x="738" y="169" fill="#DBEAFE" font-size="16" font-weight="700" text-anchor="middle">CURRENT + SCOPED?</text><text x="738" y="192" fill="#BFDBFE" font-size="13" text-anchor="middle">grounded candidate only</text>
<path d="M843 174H896" stroke="#71717A" stroke-width="3"/><path d="M889 168L901 174 889 180" fill="none" stroke="#71717A" stroke-width="3"/>
<rect x="903" y="135" width="252" height="78" rx="12" fill="#123A35" stroke="#2DD4BF"/><text x="1029" y="169" fill="#CCFBF1" font-size="16" font-weight="700" text-anchor="middle">EXPLICIT DISPOSITION</text><text x="1029" y="192" fill="#99F6E4" font-size="13" text-anchor="middle">use · deny · quarantine · escalate</text>
<path d="M442 236V272" stroke="#71717A" stroke-width="3"/><path d="M436 265L442 277 448 265" fill="none" stroke="#71717A" stroke-width="3"/>
<rect x="315" y="282" width="255" height="50" rx="10" fill="#3B1826" stroke="#FB7185"/><text x="442" y="313" fill="#FECDD3" font-size="15" font-weight="700" text-anchor="middle">QUARANTINE BY RECORD ID</text></g>
</svg>
