<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Memory Firewall containment map</title><desc id="desc">A candidate set is resolved as a whole, then contained, scoped and given an explicit disposition.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#160F25"/><stop offset="1" stop-color="#0B1527"/></linearGradient></defs>
<rect width="1200" height="500" fill="url(#bg)"/><g fill="none" stroke="#57456F" opacity=".65"><circle cx="600" cy="276" r="184"/><circle cx="600" cy="276" r="126"/><circle cx="600" cy="276" r="66"/><path d="M600 72V480M396 276H804"/></g>
<text x="52" y="61" fill="#FAF5FF" font-family="Arial,sans-serif" font-size="30" font-weight="700">Memory Firewall</text><text x="52" y="90" fill="#C2B4D6" font-family="Arial,sans-serif" font-size="15">CANDIDATE-SET CONTROL PLANE / CONTAIN BEFORE A MEMORY CAN INFLUENCE WORK</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><path d="M600 186l70 40v80l-70 40-70-40v-80z" fill="#33234C" stroke="#B295E9" stroke-width="3"/><text x="600" y="264" fill="#F3ECFF" font-size="16" font-weight="700">RESOLVE</text><text x="600" y="287" fill="#D9CCF5" font-size="13">whole set first</text>
<g fill="#231B38" stroke="#8465B8" stroke-width="2"><circle cx="600" cy="111" r="37"/><circle cx="765" cy="202" r="37"/><circle cx="765" cy="350" r="37"/><circle cx="600" cy="441" r="37"/><circle cx="435" cy="350" r="37"/><circle cx="435" cy="202" r="37"/></g>
<g fill="#F2EAFF" font-size="12" font-weight="700"><text x="600" y="107">LIFECYCLE</text><text x="765" y="198">SCOPE</text><text x="765" y="346">CONFLICT</text><text x="600" y="437">PROVENANCE</text><text x="435" y="346">TAINT</text><text x="435" y="198">SCHEMA</text></g>
<g stroke="#D79AE5" stroke-width="3"><path d="M600 148V186M633 220l99-18M635 322l97 28M600 346v57M565 322l-97 28M567 220l-99-18"/></g>
<rect x="57" y="218" width="218" height="116" rx="14" fill="#4B1D36" stroke="#FF79A8" stroke-width="2"/><text x="166" y="260" fill="#FFD3E0" font-size="17" font-weight="700">HOSTILE RECORD</text><text x="166" y="286" fill="#FFC2D5" font-size="14">quarantine by ID</text><text x="166" y="307" fill="#FFC2D5" font-size="14">do not erase clean facts</text>
<rect x="925" y="151" width="224" height="82" rx="41" fill="#123F3B" stroke="#42D0B6" stroke-width="2"/><text x="1037" y="201" fill="#C7FFF4" font-size="17" font-weight="700">USE / ALLOW</text><rect x="925" y="257" width="224" height="82" rx="41" fill="#482038" stroke="#FA86AB" stroke-width="2"/><text x="1037" y="307" fill="#FFD2DF" font-size="17" font-weight="700">DENY / ESCALATE</text>
</g></svg>
